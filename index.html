
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THWS QR Challenge</title>


<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --card-hover:#273549;

  --text:#f8fafc;
  --muted:#94a3b8;

  --border:rgba(255,255,255,.08);

  --accent:#8b5cf6;
  --accent2:#06b6d4;

  --success:#22c55e;
  --success-bg:rgba(34,197,94,.15);

  --error:#ef4444;
  --error-bg:rgba(239,68,68,.12);

  --button:#8b5cf6;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  background:
  radial-gradient(circle at top left,#312e81 0%,transparent 40%),
  radial-gradient(circle at bottom right,#0891b2 0%,transparent 40%),
  #0f172a;

  color:var(--text);

  min-height:100vh;
  padding:24px;
}

.container{
  max-width:700px;
  margin:0 auto;
}

.card{
  background:rgba(30,41,59,.88);

  backdrop-filter:blur(18px);

  border:1px solid var(--border);

  border-radius:28px;

  padding:28px;

  box-shadow:
  0 20px 50px rgba(0,0,0,.35);
}

h1{
  font-size:2rem;
  margin-bottom:10px;
  font-weight:800;
}

h2{
  font-size:1.25rem;
  margin-bottom:10px;
}

.subtitle{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:24px;
}

.progress{
  margin:24px 0;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:.95rem;
}

.progress-bar{
  height:12px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;

  background:
  linear-gradient(
    90deg,
    #06b6d4,
    #8b5cf6,
    #ec4899
  );

  transition:.4s;
}

.station{
  border:1px solid var(--border);

  background:rgba(255,255,255,.03);

  border-radius:16px;

  padding:16px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;

  transition:.25s;
}

.station:hover{
  transform:translateY(-2px);

  border-color:#8b5cf6;

  background:rgba(255,255,255,.05);
}

.station.done{
  background:rgba(34,197,94,.12);

  border-color:rgba(34,197,94,.4);
}

.question{
  margin:24px 0;
  font-size:1.1rem;
  line-height:1.7;
}

.option{
  border:1px solid var(--border);

  background:rgba(255,255,255,.03);

  border-radius:14px;

  padding:16px;

  margin-bottom:12px;

  transition:.2s;
}

.option:hover{
  border-color:#8b5cf6;
}

.option label{
  display:flex;
  gap:12px;
  cursor:pointer;
}

.option input{
  accent-color:#8b5cf6;
  transform:scale(1.2);
  margin-top:4px;
}

button{
  width:100%;

  border:none;

  border-radius:14px;

  background:
  linear-gradient(
    135deg,
    #8b5cf6,
    #06b6d4
  );

  color:white;

  padding:15px;

  font-size:1rem;
  font-weight:600;

  cursor:pointer;

  margin-top:14px;

  transition:.25s;
}

button:hover{
  transform:translateY(-2px);
}

.message{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
}

.success{
  background:var(--success-bg);
  color:#86efac;
}

.error{
  background:var(--error-bg);
  color:#fca5a5;
}

.reward{
  margin-top:24px;

  border-radius:20px;

  padding:22px;

  background:
  linear-gradient(
    135deg,
    #8b5cf6,
    #ec4899
  );

  color:white;

  box-shadow:
  0 15px 35px rgba(139,92,246,.25);
}

.reward h2{
  margin-bottom:12px;
}

.reward p{
  line-height:1.6;
}

.faculty{
  color:var(--muted);
}

@media(max-width:600px){

  body{
    padding:16px;
  }

  .card{
    padding:22px;
  }

  h1{
    font-size:1.7rem;
  }
}
</style>


</head>
<body>

<div class="container">
    <div class="card" id="app"></div>
</div>

<script>

const REQUIRED_COINS = 3;

const questions = {

1:{
faculty:"Fakultät Kunststofftechnik und Vermessung",
type:"single",
question:"Mit welchem Material könnt ihr bei uns sowohl Karabiner als auch Kreisel herstellen?",
options:[
"Polyamid gefüllt mit Glasfaser",
"Holz",
"Metall",
"Recycelter Kunststoff"
],
correct:[3]
},

2:{
faculty:"Fakultät Angewandte Natur- und Geisteswissenschaften",
type:"single",
question:"Welche der folgenden Vorlesungen findet im Studiengang »Angewandte Mathematik« der THWS statt?",
options:[
"Physiologie 1",
"Konstruktionslehre 2",
"Analysis 3",
"Marketing 4"
],
correct:[2]
},

3:{
faculty:"THWS Business School",
type:"single",
question:"Wie viele Bachelorprogramme bietet die Fakultät Business School an?",
options:[
"3",
"6",
"9",
"12"
],
correct:[1]
},

4:{
faculty:"Fakultät Wirtschaftsingenieurwesen",
type:"single",
question:"Welches Drehmoment kann man mit einem normalen Schraubendreher per Hand erreichen?",
options:[
"0,3–0,5 Nm",
"1,5–3 Nm",
"8–12 Nm"
],
correct:[1]
},

5:{
faculty:"Fakultät Architektur und Bauingenieurwesen",
type:"single",
question:"Was begrenzt die Höhe von Wolkenkratzern am stärksten?",
options:[
"Weil oben zu wenig Sauerstoff vorhanden ist",
"Wegen Wind, Schwingungen und der Materialbelastung",
"Weil Aufzüge zu langsam werden",
"Aufgrund der Erdrotation"
],
correct:[1]
},

6:{
faculty:"Fakultät Informatik und Wirtschaftsinformatik",
type:"single",
question:"Wie viele verschiedene Bachelor-Studiengänge kann man an der FIW studieren?",
options:[
"3 Studiengänge",
"4 Studiengänge",
"5 Studiengänge",
"6 Studiengänge"
],
correct:[3]
},

7:{
faculty:"Fakultät Angewandte Sozialwissenschaften",
type:"multiple",
question:"Welche akademischen Abschlüsse kann man an der Fakultät Angewandte Sozialwissenschaften erlangen?",
options:[
"Den Bachelor",
"Den Master",
"Den Doktorgrad"
],
correct:[0,1,2]
},

8:{
faculty:"Fakultät Gestaltung",
type:"multiple",
question:"Welche Themen gehören eher zum Kommunikationsdesign?",
options:[
"Marken und Logos entwickeln",
"Gestaltung von Social-Media-Inhalten",
"Steuerrecht und Buchhaltung",
"Fotografie und visuelle Kommunikation"
],
correct:[0,1,3]
},

9:{
faculty:"Fakultät Maschinenbau",
type:"single",
question:"Was passiert, wenn eine Vorrichtung mit ihrer Eigenfrequenz angeregt wird?",
options:[
"Sie schwingt stärker",
"Sie schwingt gleich stark",
"Sie schwingt weniger"
],
correct:[0]
}

};

const app = document.getElementById("app");

const params = new URLSearchParams(window.location.search);
const station = params.get("s");

let coins = JSON.parse(localStorage.getItem("coins") || "[]");
let rewardClaimed = localStorage.getItem("rewardClaimed") === "true";

function renderHome(){

let html = `
<h1>THWS QR Challenge</h1>

<p class="subtitle">
Scanne QR-Codes an den Fakultäten und beantworte die Fragen.
Für den Gewinn werden mindestens ${REQUIRED_COINS} richtige Antworten benötigt.
</p>

<div class="progress">
<div class="progress-label">
<span>${coins.length} von 9 Stationen gelöst</span>
<span>${Math.round((coins.length/9)*100)}%</span>
</div>

<div class="progress-bar">
<div class="progress-fill"
style="width:${(coins.length/9)*100}%">
</div>
</div>
</div>
`;

for(let i=1;i<=9;i++){

html += `
<div class="station ${coins.includes(String(i)) ? 'done' : ''}">
<span>${questions[i].faculty}</span>
<span>${coins.includes(String(i)) ? '✅' : '⬜'}</span>
</div>
`;
}

if(rewardClaimed){

html += `
<div class="reward">
<h2>Gewinn bereits eingelöst</h2>
<p>Vielen Dank für deine Teilnahme.</p>
</div>
`;

}
else if(coins.length >= REQUIRED_COINS){

html += `
<div class="reward">
<h2>Gewinn freigeschaltet</h2>

<p>
Gehe jetzt zum Gewinnstand und zeige diesen Button. WICHTIG: Nicht drücken, sonst ist dein Gewinn nicht mehr gültig :)
</p>

<button onclick="claimReward()">
Gewinn eingelöst
</button>
</div>
`;
}

app.innerHTML = html;
}

function showQuestion(id){

if(coins.includes(String(id))){
renderHome();
return;
}

const q = questions[id];

let html = `
<h2>${q.faculty}</h2>

<div class="question">
${q.question}
</div>

<form id="questionForm">
`;

q.options.forEach((option,index)=>{

const type = q.type === "multiple" ? "checkbox" : "radio";

html += `
<div class="option">
<label>
<input
type="${type}"
name="answer"
value="${index}">
<span>${option}</span>
</label>
</div>
`;
});

html += `
<button type="submit">
Antwort prüfen
</button>

<div id="result"></div>

</form>
`;

app.innerHTML = html;

document.getElementById("questionForm")
.addEventListener("submit", function(e){

e.preventDefault();

let selected = [];

document
.querySelectorAll("input:checked")
.forEach(el => selected.push(Number(el.value)));

selected.sort();

const correct = [...q.correct].sort();

const isCorrect =
JSON.stringify(selected) === JSON.stringify(correct);

const result = document.getElementById("result");

if(isCorrect){

if (!coins.includes(String(id))) {
    coins.push(String(id));
}
if(
  coins.length === REQUIRED_COINS &&
  !rewardClaimed
){
  alert(
    "🎉 Glückwunsch!\n\nDu hast 3 Fragen richtig beantwortet.\n\nUnten auf der Startseite wurde nun dein Gewinn freigeschaltet."
  );
}

localStorage.setItem(
"coins",
JSON.stringify(coins)
);

result.innerHTML = `
<div class="message success">
Antwort korrekt. Station erfolgreich abgeschlossen.
</div>
`;

setTimeout(()=>{
location.href = window.location.pathname;
},1500);

}else{

result.innerHTML = `
<div class="message error">
Leider nicht korrekt. Bitte versuche es erneut.
</div>
`;

}
});
}

window.claimReward = function(){

localStorage.setItem(
"rewardClaimed",
"true"
);

location.reload();
};

if(station && questions[station]){
showQuestion(station);
}else{
renderHome();
}

</script>

</body>
</html>
