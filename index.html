<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Challenge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .answer-btn {
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: 0.2s;
    }

    .answer-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .emoji {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .subtitle {
      color: #d1d5db;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .stations {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .station {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      transition: 0.3s;
    }

    .station.done {
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .station.pending {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .reward {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      border-radius: 22px;
      padding: 24px 18px;
      animation: pop 0.4s ease;
    }

    .reward h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .reward p {
      margin-bottom: 14px;
      font-size: 16px;
    }

    .code {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 14px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hidden {
      display: none;
    }

    .progress {
      margin-bottom: 22px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.9);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 28px;
      }

      .station {
        font-size: 16px;
      }

      .code {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <script>
    const questions = {
      1: {
        question: "Welche Farbe hat der Himmel?",
        answers: ["Rot", "Blau", "Grün"],
        correct: 1
      },
      2: {
        question: "Wie viele Tage hat eine Woche?",
        answers: ["7", "5", "10"],
        correct: 0
      },
      3: {
        question: "Welches Tier miaut?",
        answers: ["Hund", "Katze", "Pferd"],
        correct: 1
      },
      4: {
        question: "Wie viel ist 2 + 2?",
        answers: ["3", "4", "5"],
        correct: 1
      },
      5: {
        question: "Welche Jahreszeit kommt nach dem Frühling?",
        answers: ["Winter", "Herbst", "Sommer"],
        correct: 2
      }
    };

    const params = new URLSearchParams(window.location.search);
    const station = params.get("s");

    let coins = JSON.parse(localStorage.getItem("coins") || "[]");
    let rewardClaimed = localStorage.getItem("rewardClaimed") === "true";

    const container = document.querySelector(".container");

    function renderHome() {

      let html = `
    <div class="emoji">🪙</div>

    <h1>QR Challenge</h1>

    <p class="subtitle">
      Sammle mindestens 3 Münzen. Scanne dafür die QR Codes mit den Fragen mit deiner Kamera.
    </p>

    <div class="progress">
      <div>${coins.length} / 3 Münzen gesammelt</div>

      <div class="progress-bar">
        <div class="progress-fill"
             style="width:${Math.min(coins.length, 3) / 3 * 100}%"></div>
      </div>
    </div>
  `;

      for (let i = 1; i <= 5; i++) {

        const done = coins.includes(String(i));

        html += `
      <div class="station ${done ? 'done' : 'pending'}">
        <span>Station ${i}</span>
        <span>${done ? '🪙' : '⬜'}</span>
      </div>
    `;
      }

      if (rewardClaimed) {

        html += `
      <div class="reward">
        <h2>Der Gewinn wurde bereits eingelöst</h2>
      </div>
    `;

      } else if (coins.length >= 3) {

        html += `
      <div class="reward">
        <h2>🎉 Glückwunsch!</h2>

        <p>
          Gehe jetzt zum Gewinnstand und zeige deinen Gewinn einmal vor.
        </p>

        <button id="claimReward">
          Gewinn eingelöst
        </button>
      </div>
    `;
      }

      container.innerHTML = html;

      const btn = document.getElementById("claimReward");

      if (btn) {
        btn.addEventListener("click", () => {

          localStorage.setItem("rewardClaimed", "true");

          location.href = window.location.pathname;
        });
      }
    }

    function showQuestion(stationId) {

      if (coins.includes(stationId)) {

        renderHome();
        return;
      }

      const q = questions[stationId];

      if (!q) {
        renderHome();
        return;
      }

      let answersHtml = "";

      q.answers.forEach((answer, index) => {

        answersHtml += `
      <button
        class="answer-btn"
        onclick="checkAnswer(${stationId},${index})">
        ${answer}
      </button>
    `;
      });

      container.innerHTML = `
    <div class="emoji">❓</div>

    <h1>Station ${stationId}</h1>

    <p style="margin-bottom:20px;">
      ${q.question}
    </p>

    <div style="display:flex;flex-direction:column;gap:10px;">
      ${answersHtml}
    </div>

    <p id="result"
       style="margin-top:20px;font-weight:bold;">
    </p>
  `;
    }

    window.checkAnswer = function (stationId, answerIndex) {

      const q = questions[stationId];
      const result = document.getElementById("result");

      if (answerIndex === q.correct) {

        coins.push(String(stationId));

        localStorage.setItem(
          "coins",
          JSON.stringify(coins)
        );

        result.innerHTML =
          "✅ Richtig! Du hast eine Münze erhalten.";

        setTimeout(() => {
          location.href = window.location.pathname;
        }, 1500);

      } else {

        result.innerHTML =
          "❌ Schade, versuche es nochmal.";
      }
    }

    if (station && questions[station]) {
      showQuestion(station);
    } else {
      renderHome();
    }
  </script>

</body>

</html>
