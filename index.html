<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Challenge</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      text-align: center;
    }

    .emoji {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .subtitle {
      color: #d1d5db;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .stations {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .station {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      transition: 0.3s;
    }

    .station.done {
      background: rgba(34,197,94,0.18);
      border: 1px solid rgba(34,197,94,0.4);
    }

    .station.pending {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .reward {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      border-radius: 22px;
      padding: 24px 18px;
      animation: pop 0.4s ease;
    }

    .reward h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .reward p {
      margin-bottom: 14px;
      font-size: 16px;
    }

    .code {
      background: rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 14px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hidden {
      display: none;
    }

    .progress {
      margin-bottom: 22px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 28px;
      }

      .station {
        font-size: 16px;
      }

      .code {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="emoji">🎯</div>

    <h1>QR Challenge</h1>

    <p class="subtitle">
      Scanne alle 3 Stationen, um deinen Gutschein freizuschalten.
    </p>

    <div class="progress">
      <div id="progressText">0 / 3 Stationen geschafft</div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="stations" id="status"></div>

    <div id="reward" class="reward hidden">
      <h2>🎉 Gutschein freigeschaltet!</h2>

      <p>Zeig diesen Screen vor:</p>

      <div class="code">
        POPCORN-2026
      </div>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const station = params.get("s");

    let scanned = JSON.parse(localStorage.getItem("scanned") || "{}");

    if (station) {
      scanned[station] = true;
      localStorage.setItem("scanned", JSON.stringify(scanned));
    }

    const status = document.getElementById("status");

    let completed = 0;

    for (let i = 1; i <= 3; i++) {
      const isDone = scanned[i];

      if (isDone) completed++;

      const div = document.createElement("div");
      div.className = `station ${isDone ? "done" : "pending"}`;

      div.innerHTML = `
        <span>Station ${i}</span>
        <span>${isDone ? "✅" : "⬜"}</span>
      `;

      status.appendChild(div);
    }

    document.getElementById("progressText").innerText =
      `${completed} / 3 Stationen geschafft`;

    document.getElementById("progressFill").style.width =
      `${(completed / 3) * 100}%`;

    if (scanned[1] && scanned[2] && scanned[3]) {
      document.getElementById("reward").classList.remove("hidden");
    }
  </script>

</body>
</html>
